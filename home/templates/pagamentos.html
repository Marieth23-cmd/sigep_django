<div class="pagamentos-container">

    <div class="pagamentos-header">
        <div>
            <h2>Gestao de Pagamentos</h2>
            <p>Registo mensal de propinas</p>
        </div>

        <button class="btn-primary" onclick="abrirModalPagamento()">
            <i class="fas fa-plus"></i>
            Registar Pagamento
        </button>
    </div>

    <div class="pagamentos-stats" id="statsContainer">
        <p>Carregando estatisticas...</p>
    </div>

    <div id="mensagemPagamentos"></div>

    <div class="table-card">

        <div class="table-header">

            <h3>Historico do mes selecionado</h3>

            <div>
                <select id="mesPagamento" onchange="atualizarPagamentosMes()">
                    <option value="">Selecionar mes</option>
                    <option value="1">Janeiro</option>
                    <option value="2">Fevereiro</option>
                    <option value="3">Março</option>
                    <option value="4">Abril</option>
                    <option value="5">Maio</option>
                    <option value="6">Junho</option>
                    <option value="7">Julho</option>
                    <option value="8">Agosto</option>
                    <option value="9">Setembro</option>
                    <option value="10">Outubro</option>
                    <option value="11">Novembro</option>
                    <option value="12">Dezembro</option>
                </select>

                <select id="anoPagamento" onchange="atualizarPagamentosMes()">
                    <option value="">Selecionar ano</option>
                </select>
            </div>

        </div>

        <div class="loading" id="loadingPagamentos">
            <i class="fas fa-spinner fa-spin"></i> Carregando pagamentos...
        </div>

        <table class="pagamentos-table">

            <thead>
                <tr>
                    <th>N.</th>
                    <th>Aluno</th>
                    <th>Curso</th>
                    <th>Turma</th>
                    <th>Sala</th>
                    <th>Mes/Ano</th>
                    <th>Propina</th>
                    <th>Pago</th>
                    <th>Data</th>
                    <th>Metodo</th>
                </tr>
            </thead>

            <tbody id="pagamentosBody"></tbody>

        </table>

    </div>

</div>

<div class="modal-overlay" id="modalPagamento" onclick="fecharModalPagamento(event)">

    <div class="modal-aluno modal-pagamento" onclick="event.stopPropagation()">

        <h3>Registar Pagamento</h3>
        <div id="mensagemPagamentoModal"></div>

        <div class="pagamento-aluno-search">
            <input
                type="text"
                id="pesquisaAlunoPagamento"
                placeholder="Pesquisar por nome, numero, turma ou curso"
                autocomplete="off"
                oninput="pesquisarAlunoPagamento()"
            >
            <input type="hidden" id="alunoModalPagamento">
            <div class="aluno-search-results" id="resultadosAlunoPagamento"></div>
            <div class="aluno-selecionado" id="alunoSelecionadoPagamento"></div>
        </div>

        <input
            type="number"
            id="mesPagamentoModal"
            placeholder="Mes (1-12)"
            min="1"
            max="12"
            oninput="validarPagamentoExistente()"
        >

        <input
            type="number"
            id="anoPagamentoModal"
            placeholder="Ano"
            oninput="validarPagamentoExistente()"
        >

        <input
            type="number"
            id="valorPropina"
            placeholder="Valor da propina"
            step="0.01"
            readonly
        >

        <input
            type="number"
            id="valorPago"
            placeholder="Valor pago"
            step="0.01"
            readonly
        >

        <input
            type="date"
            id="dataPagamento"
            placeholder="Data do pagamento"
        >

        <select id="metodoPagamento">
            <option value="">Selecionar metodo</option>
            <option value="Dinheiro">Dinheiro</option>
            <option value="Transferencia">Transferencia</option>
            <option value="Cheque">Cheque</option>
            <option value="Cartao">Cartao</option>
        </select>

        <textarea
            id="observacaoPagamento"
            placeholder="Observacoes"
            rows="3"
        ></textarea>

        <div class="modal-footer">
            <button class="btn-cancelar" onclick="fecharModalPagamento()">
                Cancelar
            </button>

            <button class="btn-guardar" id="btnSalvarPagamento" onclick="salvarPagamento()">
                Registar
            </button>
        </div>

    </div>

</div>

<script>

let pagamentos = [];
let alunos = [];
let alunoSelecionado = null;
let alunoSearchRequest = 0;

function iniciarPaginaPagamentos() {
    const hoje = new Date();
    preencherAnosPagamento();
    document.getElementById('mesPagamento').value = hoje.getMonth() + 1;
    document.getElementById('anoPagamento').value = hoje.getFullYear();
    atualizarPagamentosMes();
}

iniciarPaginaPagamentos();

function preencherAnosPagamento() {
    const select = document.getElementById('anoPagamento');
    const anoAtual = new Date().getFullYear();
    const primeiroAno = anoAtual - 5;
    const ultimoAno = anoAtual + 2;

    select.innerHTML = '<option value="">Selecionar ano</option>';

    for (let ano = ultimoAno; ano >= primeiroAno; ano--) {
        const option = document.createElement('option');
        option.value = ano;
        option.textContent = ano;
        select.appendChild(option);
    }
}

function atualizarPagamentosMes() {
    carregarPagamentos();
    carregarEstatisticas();
}

function normalizarTexto(valor) {
    return String(valor || '').toLowerCase();
}

function obterValorDevido(aluno) {
    const propina = parseFloat(aluno.propina_mensal) || 0;
    const desconto = parseFloat(aluno.bolsa_desconto) || 0;
    return propina * (100 - desconto) / 100;
}

function formatarKz(valor) {
    return (parseFloat(valor) || 0).toFixed(2) + ' Kz';
}

async function carregarPagamentos() {
    document.getElementById('loadingPagamentos').classList.add('active');
    const mes = document.getElementById('mesPagamento').value;
    const ano = document.getElementById('anoPagamento').value;

    if (!mes || !ano) {
        document.getElementById('loadingPagamentos').classList.remove('active');
        return;
    }

    try {
        const response = await axios.get(API_BASE + 'pagamentos/por_mes_ano/?mes=' + mes + '&ano=' + ano);
        pagamentos = response.data.results || response.data;
        preencherTabelaPagamentos(pagamentos);
    } catch (error) {
        console.error('Erro ao carregar pagamentos:', error);
        mostrarMensagem('mensagemPagamentos', 'Erro ao carregar pagamentos', 'error');
    } finally {
        document.getElementById('loadingPagamentos').classList.remove('active');
    }
}

function preencherTabelaPagamentos(pagsList) {
    const tbody = document.getElementById('pagamentosBody');
    tbody.innerHTML = '';

    if (pagsList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding:20px;">Nenhum pagamento encontrado para este mes</td></tr>';
        return;
    }

    pagsList.forEach(pag => {
        const tr = document.createElement('tr');
        const data = new Date(pag.data_pagamento);

        tr.innerHTML = `
            <td>#${pag.aluno_numero || '-'}</td>
            <td>${pag.aluno_nome || '-'}</td>
            <td>${pag.curso_nome || '-'}</td>
            <td>${pag.turma_nome || '-'}</td>
            <td>${pag.sala ? 'Sala ' + pag.sala : '-'}</td>
            <td>${pag.mes}/${pag.ano}</td>
            <td>${formatarKz(pag.valor_propina)}</td>
            <td>${formatarKz(pag.valor_pago)}</td>
            <td>${data.toLocaleDateString('pt-PT')}</td>
            <td>${pag.metodo_pagamento || '-'}</td>
        `;
        tbody.appendChild(tr);
    });
}

async function pesquisarAlunoPagamento() {
    const termo = normalizarTexto(document.getElementById('pesquisaAlunoPagamento').value);
    const resultados = document.getElementById('resultadosAlunoPagamento');
    const requestId = ++alunoSearchRequest;

    document.getElementById('alunoModalPagamento').value = '';
    alunoSelecionado = null;
    atualizarResumoAlunoSelecionado();

    if (termo.length < 2) {
        resultados.style.display = 'none';
        resultados.innerHTML = '';
        return;
    }

    resultados.style.display = 'block';
    resultados.innerHTML = '<div class="aluno-search-empty">A pesquisar...</div>';

    try {
        const response = await axios.get(API_BASE + 'alunos/?search=' + encodeURIComponent(termo));
        if (requestId !== alunoSearchRequest) return;
        alunos = (response.data.results || response.data).slice(0, 8);
    } catch (error) {
        console.error('Erro ao pesquisar alunos:', error);
        resultados.innerHTML = '<div class="aluno-search-empty">Erro ao pesquisar alunos</div>';
        return;
    }

    if (alunos.length === 0) {
        resultados.innerHTML = '<div class="aluno-search-empty">Nenhum aluno encontrado</div>';
        return;
    }

    resultados.innerHTML = alunos.map(aluno => `
        <button type="button" class="aluno-search-item" onclick="selecionarAlunoPagamento(${aluno.id_aluno})">
            <strong>#${aluno.numero_aluno} - ${aluno.nome}</strong>
            <span>${aluno.curso_nome || '-'} / ${aluno.turma_nome || '-'} / Sala ${aluno.sala || '-'}</span>
        </button>
    `).join('');
}

function selecionarAlunoPagamento(alunoId) {
    alunoSelecionado = alunos.find(aluno => aluno.id_aluno === alunoId);
    if (!alunoSelecionado) return;

    const valorDevido = obterValorDevido(alunoSelecionado).toFixed(2);
    document.getElementById('alunoModalPagamento').value = alunoSelecionado.id_aluno;
    document.getElementById('pesquisaAlunoPagamento').value = '#' + alunoSelecionado.numero_aluno + ' - ' + alunoSelecionado.nome;
    document.getElementById('valorPropina').value = valorDevido;
    document.getElementById('valorPago').value = valorDevido;
    document.getElementById('resultadosAlunoPagamento').style.display = 'none';
    atualizarResumoAlunoSelecionado();
    validarPagamentoExistente();
}

function atualizarResumoAlunoSelecionado() {
    const resumo = document.getElementById('alunoSelecionadoPagamento');
    if (!alunoSelecionado) {
        resumo.innerHTML = '';
        resumo.style.display = 'none';
        return;
    }

    const desconto = parseFloat(alunoSelecionado.bolsa_desconto) || 0;
    resumo.style.display = 'block';
    resumo.innerHTML = `
        <strong>${alunoSelecionado.nome}</strong>
        <span>N. ${alunoSelecionado.numero_aluno} / ${alunoSelecionado.curso_nome || '-'} / ${alunoSelecionado.turma_nome || '-'} / Sala ${alunoSelecionado.sala || '-'}</span>
        <span>Propina a pagar: ${formatarKz(obterValorDevido(alunoSelecionado))}${desconto ? ' com bolsa de ' + desconto + '%' : ''}</span>
    `;
}

function validarPagamentoExistente() {
    const alunoId = parseInt(document.getElementById('alunoModalPagamento').value, 10);
    const mes = parseInt(document.getElementById('mesPagamentoModal').value, 10);
    const ano = parseInt(document.getElementById('anoPagamentoModal').value, 10);
    const btn = document.getElementById('btnSalvarPagamento');

    btn.disabled = false;

    if (!alunoId || !mes || !ano) return false;

    const jaExiste = pagamentos.some(pag =>
        parseInt(pag.id_aluno, 10) === alunoId &&
        parseInt(pag.mes, 10) === mes &&
        parseInt(pag.ano, 10) === ano
    );

    if (jaExiste) {
        mostrarMensagem('mensagemPagamentoModal', 'Este aluno ja pagou este mes. Para dois meses adiantados, registe outro mes.', 'error');
        btn.disabled = true;
        return true;
    }

    document.getElementById('mensagemPagamentoModal').innerHTML = '';
    document.getElementById('mensagemPagamentoModal').className = '';
    return false;
}

async function carregarEstatisticas() {
    const mes = document.getElementById('mesPagamento').value;
    const ano = document.getElementById('anoPagamento').value;
    if (!mes || !ano) return;

    try {
        const response = await axios.get(API_BASE + 'pagamentos/resumo/?mes=' + mes + '&ano=' + ano);
        const stats = response.data;

        const statsContainer = document.getElementById('statsContainer');
        statsContainer.innerHTML = `
            <div class="pagamento-stat-card">
                <div class="pagamento-icon total">
                    <i class="fas fa-users"></i>
                </div>
                <div>
                    <p class="stat-label">Alunos activos</p>
                    <h3>${stats.total_alunos}</h3>
                </div>
            </div>

            <div class="pagamento-stat-card">
                <div class="pagamento-icon pago">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div>
                    <p class="stat-label">Pagos no mes</p>
                    <h3>${stats.pagos}</h3>
                </div>
            </div>

            <div class="pagamento-stat-card">
                <div class="pagamento-icon pendente">
                    <i class="fas fa-clock"></i>
                </div>
                <div>
                    <p class="stat-label">Em falta no mes</p>
                    <h3>${stats.em_falta}</h3>
                </div>
            </div>

            <div class="pagamento-stat-card">
                <div class="pagamento-icon atrasado">
                    <i class="fas fa-exclamation-circle"></i>
                </div>
                <div>
                    <p class="stat-label">Atrasados/acumulados</p>
                    <h3>${stats.atrasados}</h3>
                </div>
            </div>
        `;
    } catch (error) {
        console.error('Erro ao carregar estatisticas:', error);
    }
}

function abrirModalPagamento() {
    const mes = document.getElementById('mesPagamento').value;
    const ano = document.getElementById('anoPagamento').value;
    const hoje = new Date();

    document.getElementById('mesPagamentoModal').value = mes || (hoje.getMonth() + 1);
    document.getElementById('anoPagamentoModal').value = ano || hoje.getFullYear();
    document.getElementById('dataPagamento').value = hoje.toISOString().split('T')[0];
    document.getElementById('modalPagamento').style.display = 'flex';
}

function fecharModalPagamento(event) {
    if (event && event.target.id !== 'modalPagamento') return;
    document.getElementById('modalPagamento').style.display = 'none';
    limparFormularioPagamento();
}

function limparFormularioPagamento() {
    document.getElementById('pesquisaAlunoPagamento').value = '';
    document.getElementById('alunoModalPagamento').value = '';
    document.getElementById('resultadosAlunoPagamento').innerHTML = '';
    document.getElementById('resultadosAlunoPagamento').style.display = 'none';
    document.getElementById('mesPagamentoModal').value = '';
    document.getElementById('anoPagamentoModal').value = '';
    document.getElementById('valorPropina').value = '';
    document.getElementById('valorPago').value = '';
    document.getElementById('dataPagamento').value = '';
    document.getElementById('metodoPagamento').value = '';
    document.getElementById('observacaoPagamento').value = '';
    document.getElementById('mensagemPagamentoModal').innerHTML = '';
    document.getElementById('mensagemPagamentoModal').className = '';
    document.getElementById('btnSalvarPagamento').disabled = false;
    alunoSelecionado = null;
    atualizarResumoAlunoSelecionado();
}

async function salvarPagamento() {
    const alunoId = document.getElementById('alunoModalPagamento').value;
    const mes = document.getElementById('mesPagamentoModal').value;
    const ano = document.getElementById('anoPagamentoModal').value;
    const valorPropina = document.getElementById('valorPropina').value;
    const valorPago = document.getElementById('valorPago').value;
    const dataPagamento = document.getElementById('dataPagamento').value;

    if (!alunoId || !mes || !ano || !valorPropina || !valorPago || !dataPagamento) {
        mostrarMensagem('mensagemPagamentoModal', 'Selecione o aluno e preencha os campos obrigatorios', 'error');
        return;
    }

    if (validarPagamentoExistente()) return;

    try {
        const dados = {
            id_aluno: parseInt(alunoId, 10),
            mes: parseInt(mes, 10),
            ano: parseInt(ano, 10),
            valor_propina: valorPropina,
            valor_pago: valorPago,
            data_pagamento: dataPagamento,
            metodo_pagamento: document.getElementById('metodoPagamento').value,
            observacao: document.getElementById('observacaoPagamento').value,
        };

        await axios.post(API_BASE + 'pagamentos/', dados);
        mostrarMensagem('mensagemPagamentoModal', 'Pagamento registado com sucesso!', 'success');

        setTimeout(() => {
            fecharModalPagamento();
            document.getElementById('mesPagamento').value = mes;
            document.getElementById('anoPagamento').value = ano;
            atualizarPagamentosMes();
        }, 1000);
    } catch (error) {
        console.error('Erro ao salvar pagamento:', error);
        const data = error.response?.data;
        const mensagem = data ? JSON.stringify(data) : 'Erro ao registar pagamento';
        mostrarMensagem('mensagemPagamentoModal', mensagem, 'error');
    }
}

function mostrarMensagem(elementId, mensagem, tipo) {
    const elemento = document.getElementById(elementId);
    elemento.className = tipo;
    elemento.innerHTML = mensagem;
}
</script>
