<div class="cursos-page">

    <div class="cursos-topo">

        <div>
            <h2>Cursos Disponíveis</h2>
            <p>Gerir cursos e propinas base</p>
        </div>

        <button class="btn-novo-curso" onclick="abrirModalCurso()">
            <i class="fas fa-plus"></i>
            Novo Curso
        </button>

    </div>

    <div class="loading" id="loadingCursos">
        <i class="fas fa-spinner fa-spin"></i> Carregando cursos...
    </div>

    <div id="mensagemCursos"></div>

    <div class="cursos-grid" id="cursosGrid">
        <!-- Preenchida via JavaScript -->
    </div>

</div>

<!-- MODAL CURSO -->
<div class="modal-overlay" id="modalCurso" onclick="fecharModalCurso(event)">

    <div class="modal-aluno" onclick="event.stopPropagation()">

        <h3>Novo Curso</h3>
        <div id="mensagemCursoModal"></div>

        <input
            type="text"
            id="nomeCurso"
            placeholder="Nome do curso"
        >

        <input
            type="number"
            id="propinaMensalCurso"
            placeholder="Propina mensal (Kz)"
            step="0.01"
        >

        
        <div class="modal-footer">

            <button
                class="btn-cancelar"
                onclick="fecharModalCurso()"
            >
                Cancelar
            </button>

            <button class="btn-guardar" onclick="salvarCurso()">
                Guardar
            </button>

        </div>

    </div>

</div>

<script>

let cursos = [];

document.addEventListener('DOMContentLoaded', function() {
    carregarCursos();
});

async function carregarCursos() {
    document.getElementById('loadingCursos').classList.add('active');
    try {
        const response = await axios.get(API_BASE + 'cursos/');
        cursos = response.data.results || response.data;
        preencherCursosGrid(cursos);
    } catch (error) {
        console.error('Erro ao carregar cursos:', error);
        mostrarMensagem('mensagemCursos', 'Erro ao carregar cursos', 'error');
    } finally {
        document.getElementById('loadingCursos').classList.remove('active');
    }
}

function preencherCursosGrid(cursosList) {
    const grid = document.getElementById('cursosGrid');
    grid.innerHTML = '';

    if (cursosList.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px;">Nenhum curso encontrado</p>';
        return;
    }

    cursosList.forEach(curso => {
        const card = document.createElement('div');
        card.className = 'curso-card';
        const propina = Number(curso.propina_mensal) || 0;
        card.innerHTML = `
            <div class="curso-header">
                <div class="curso-icon">
                    <i class="fas fa-book-open"></i>
                </div>
                <div>
                    <h3>${curso.nome}</h3>
                    <p>Propina: ${propina.toFixed(2)} Kz</p>
                </div>
            </div>
            <div class="curso-info">
                <div class="curso-box">
                    <span><i class="fas fa-wallet"></i> Propina Mensal</span>
                    <strong>${propina.toFixed(2)} Kz</strong>
                </div>
            </div>
            <button class="btn-detalhes" onclick="editarCurso(${curso.id_curso})">
                Ver detalhes
            </button>
        `;
        grid.appendChild(card);
    });
}

function abrirModalCurso() {
    document.getElementById('modalCurso').style.display = 'flex';
}

function fecharModalCurso(event) {
    if (event && event.target.id !== 'modalCurso') return;
    document.getElementById('modalCurso').style.display = 'none';
    limparFormularioCurso();
}

function limparFormularioCurso() {
    document.getElementById('nomeCurso').value = '';
    document.getElementById('propinaMensalCurso').value = '';
    document.getElementById('mensagemCursoModal').innerHTML = '';
}

async function salvarCurso() {
    const nomeCurso = document.getElementById('nomeCurso').value;
    const propinaMensalCurso = document.getElementById('propinaMensalCurso').value;

    if (!nomeCurso || !propinaMensalCurso) {
        mostrarMensagem('mensagemCursoModal', 'Preencha todos os campos', 'error');
        return;
    }

    try {
        const dados = {
            nome: nomeCurso,
            propina_mensal: propinaMensalCurso,
            id_escola: 1,
        };

        await axios.post(API_BASE + 'cursos/', dados);
        mostrarMensagem('mensagemCursoModal', 'Curso registado com sucesso!', 'success');
        
        setTimeout(() => {
            fecharModalCurso();
            carregarCursos();
        }, 1500);
    } catch (error) {
        console.error('Erro ao salvar curso:', error);
        mostrarMensagem('mensagemCursoModal', 'Erro ao registar curso', 'error');
    }
}

function editarCurso(id) {
    alert('Funcionalidade em desenvolvimento');
}

function mostrarMensagem(elementId, mensagem, tipo) {
    const elemento = document.getElementById(elementId);
    elemento.className = tipo;
    elemento.innerHTML = mensagem;
}
</script>
